version: '3.8'
services:
  node1:
    build:
      context: ./node
    container_name: node1
    restart: unless-stopped
    ports:
      - "5001:5000"      # host:container
    volumes:
      - ./node/storage:/app/storage
    environment:
      SELF_ADDR: "node1:5000"
      PEERS: "node2:5000,node3:5000"

  node2:
    build:
      context: ./node
    container_name: node2
    restart: unless-stopped
    ports:
      - "5002:5000"
    volumes:
      - ./node/storage:/app/storage
    environment:
      SELF_ADDR: "node2:5000"
      PEERS: "node1:5000,node3:5000"

  node3:
    build:
      context: ./node
    container_name: node3
    restart: unless-stopped
    ports:
      - "5003:5000"
    volumes:
      - ./node/storage:/app/storage
    environment:
      SELF_ADDR: "node3:5000"
      PEERS: "node1:5000,node2:5000"

networks:
  default:
    driver: bridge